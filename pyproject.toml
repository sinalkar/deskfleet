[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infra", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # keep (str, Enum) — .value access is used throughout
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "."]
addopts = "-ra"
