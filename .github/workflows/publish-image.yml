name: Publish Image

on:
  push:
    branches: [main]

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on every push to main: tests are the gate, then the immutable per-commit
  # SHA API image is built and pushed to GHCR. Requires no external configuration
  # beyond the automatic GITHUB_TOKEN.
  publish:
    name: Test & Publish SHA Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      # 1) Run tests as the publish gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

      # 2) Publish image to GitHub Container Registry (ghcr.io).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          # `latest` and semver tags are owned by release-image.yml (on release
          # published). This workflow only publishes an immutable per-commit SHA tag.
          tags: |
            ghcr.io/${{ github.repository }}/deskfleet-api:${{ github.sha }}
