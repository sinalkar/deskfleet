name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-and-deploy:
    name: Publish SHA Image & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push image to GitHub Container Registry
      id-token: write        # GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # 1) Run tests again as the deploy gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

      # 2) Publish image to GitHub Container Registry (ghcr.io).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          # `latest` and semver tags are owned by release-image.yml (on release
          # published). Deploy only publishes an immutable per-commit SHA tag,
          # which is what Cloud Run pins to below.
          tags: |
            ghcr.io/${{ github.repository }}/deskfleet-api:${{ github.sha }}

      # 3) Deploy to Cloud Run.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: deskfleet-api
          region: ${{ secrets.GCP_REGION }}
          image: ghcr.io/${{ github.repository }}/deskfleet-api:${{ github.sha }}
          env_vars: |
            LLM_MODEL=gpt-4o-mini
            LANGCHAIN_TRACING_V2=true
            LANGCHAIN_PROJECT=deskfleet
          secrets: |
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest
