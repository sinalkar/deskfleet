services:
  api:
    build:
      context: ./apps/api
    image: deskfleet-api
    env_file:
      - .env
    environment:
      PORT: "8080"
      SQLITE_PATH: "/data/deskfleet.db"
    ports:
      - "8080:8080"
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/health'); "]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./apps/ui
    image: deskfleet-ui
    environment:
      API_URL: "http://api:8080"
    ports:
      - "8501:8501"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  api_data:
